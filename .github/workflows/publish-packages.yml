name: Publish GraphiteUi

on:
  push:
    branches:
      - master
      - develop

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GraphiteUi/GraphiteUi.csproj

      - name: Build (Release)
        run: dotnet build GraphiteUi/GraphiteUi.csproj -c Release --no-restore

      - name: Compute package version
        shell: bash
        run: |
          BASE_VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' GraphiteUi/GraphiteUi.csproj || true)"

          if [[ -z "$BASE_VERSION" ]]; then
            echo "::error::Could not find <Version> in GraphiteUi/GraphiteUi.csproj"
            exit 1
          fi

          if [[ "$BASE_VERSION" == *-* ]]; then
            echo "::error::Base <Version> must not contain a prerelease suffix. Found: $BASE_VERSION"
            exit 1
          fi

          PACKAGE_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "Using package version: $PACKAGE_VERSION"

      - name: Pack
        run: dotnet pack GraphiteUi/GraphiteUi.csproj -c Release --no-build -p:PackageVersion=${PACKAGE_VERSION} -o ./artifacts

      - name: Publish to GitHub Packages
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GH_PACKAGES_TOKEN }}" --skip-duplicate
